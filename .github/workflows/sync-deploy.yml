name: Sync upstream and deploy

on:
  push:
    branches: [ zh ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: zh

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/cloudflare/kumo.git
          git fetch upstream main

      - name: Detect whether to run
        id: detect
        run: |
          case "${{ github.event_name }}" in
            schedule)
              if git merge-base --is-ancestor upstream/main HEAD; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "reason=no-upstream-change" >> "$GITHUB_OUTPUT"
              else
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "reason=upstream-advanced" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "reason=pushed-changes" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "reason=workflow-dispatch" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Sync (merge) upstream main into zh
        id: merge
        if: steps.detect.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PRE=$(git rev-parse HEAD)
          if ! git merge upstream/main --no-edit; then
            git merge --abort
            echo "::error::Merge conflict while merging upstream/main into zh. Translation refresh required."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$PRE" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            git rev-parse upstream/main > /tmp/upstream-sha.txt
            git diff --name-only "$PRE" HEAD -- \
              packages/kumo-docs-astro/src/pages \
              packages/kumo-docs-astro/src/components \
              packages/kumo-docs-astro/src/layouts > /tmp/changed-docs.txt || true
            cat /tmp/changed-docs.txt
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open translation issue on conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '上游 cloudflare/kumo 变更与汉化冲突，需要补译',
              labels: ['translation'],
              body: `自动同步在合并 \`cloudflare/kumo@main\` 到 \`zh\` 时发生冲突（触发事件 ${context.eventName}）。\n\n翻译 Agent 会尝试解决并增量汉化（见 translate workflow）；如自动处理失败，请手动解决后重跑 "Sync upstream and deploy"（workflow_dispatch）。\n\n触发时间: ${new Date().toISOString()}`
            })

      - name: Setup pnpm
        if: steps.merge.outcome == 'success'
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node 24
        if: steps.merge.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outcome == 'success'
        run: pnpm install

      - name: Build kumo
        if: steps.merge.outcome == 'success'
        run: pnpm --filter @cloudflare/kumo build

      - name: Build docs
        if: steps.merge.outcome == 'success'
        run: pnpm --filter @cloudflare/kumo-docs-astro build

      - name: Deploy to Cloudflare Pages (kumo.dsuk.top)
        if: steps.merge.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/kumo-docs-astro/dist --project-name=kumo-docs-zh --branch=main

      - name: Report changed docs files
        if: steps.merge.outputs.merged == 'true'
        run: |
          {
            echo "## 同步结果"
            echo "上游提交: \`$(head -c 8 /tmp/upstream-sha.txt)\`"
            echo ""
            echo "### 本次上游变更涉及的文档文件（可能影响已翻译页面，需补译检查）"
            if [ -s /tmp/changed-docs.txt ]; then
              sed 's/^/- \`/' /tmp/changed-docs.txt | sed 's/$/\`/'
            else
              echo "（无文档内容变更，仅组件源码/依赖变化）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File translation request issue for changed docs
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = fs.readFileSync('/tmp/upstream-sha.txt', 'utf8').trim().slice(0, 8);
            let changed = '';
            try { changed = fs.readFileSync('/tmp/changed-docs.txt', 'utf8').trim(); } catch {}
            if (!changed) { console.log('no doc files changed; skip issue'); return; }
            const files = changed.split('\n').filter(Boolean);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'translation',
            });
            if (existing.data.some((i) => i.title.includes(sha))) {
              console.log(`open translation issue already exists for ${sha}; skip`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `translation: 需补译上游 ${sha}`,
              labels: ['translation'],
              body: `上游 \`cloudflare/kumo@${sha}\` 的文档内容有更新，以下文件需要增量补译为简体中文：\n\n${files.map((f) => '- ' + f).join('\n')}\n\n翻译 Agent 会自动处理本 issue（translate workflow），完成后会评论并关闭本 issue。`
            });

      - name: Prune upstream workflows and push merged zh
        if: steps.merge.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .github/workflows/sync-deploy.yml /tmp/sync-deploy.yml
          cp .github/workflows/translate.yml /tmp/translate.yml
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/sync-deploy.yml .github/workflows/sync-deploy.yml
          cp /tmp/translate.yml .github/workflows/translate.yml
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit; nothing to push"
          else
            git commit -m "chore(zh): sync upstream $(head -c 8 /tmp/upstream-sha.txt)"
            git push origin zh
          fi