name: Sync upstream and deploy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "即使无上游变更也强制同步并部署"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: zh

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/cloudflare/kumo.git
          git fetch upstream main

      - name: Detect upstream change
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=forced" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-upstream-change" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=upstream-advanced" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream main into zh
        if: steps.detect.outputs.changed == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge upstream/main --no-edit; then
            git merge --abort
            echo "::error::Merge conflict while merging upstream/main into zh. Translation refresh required."
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          git rev-parse upstream/main > /tmp/upstream-sha.txt
          git diff --name-only HEAD^ HEAD -- packages/kumo-docs-astro/src/pages packages/kumo-docs-astro/src/components packages/kumo-docs-astro/src/layouts > /tmp/changed-docs.txt || true
          cat /tmp/changed-docs.txt

      - name: Open translation issue on conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '上游 cloudflare/kumo 变更与汉化冲突，需要补译',
              body: `自动同步在合并 \`cloudflare/kumo@main\` 到 \`zh\` 时发生冲突（触发事件 ${context.eventName}）。\n\n请在本仓库操作台解决冲突后，二次运行 "Sync upstream and deploy"（workflow_dispatch）。\n\n触发时间: ${new Date().toISOString()}`
            })

      - name: Setup pnpm
        if: steps.merge.outcome == 'success'
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node 24
        if: steps.merge.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outcome == 'success'
        run: pnpm install

      - name: Build kumo
        if: steps.merge.outcome == 'success'
        run: pnpm --filter @cloudflare/kumo build

      - name: Build docs
        if: steps.merge.outcome == 'success'
        run: pnpm --filter @cloudflare/kumo-docs-astro build

      - name: Deploy to Cloudflare Pages (kumo.dsuk.top)
        if: steps.merge.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/kumo-docs-astro/dist --project-name=kumo-docs-zh --branch=main

      - name: Report changed docs files
        if: steps.merge.outcome == 'success'
        run: |
          {
            echo "## 同步结果"
            echo "上游提交: \`$(head -c 8 /tmp/upstream-sha.txt)\`"
            echo ""
            echo "### 本次上游变更涉及的文件（可能影响已翻译页面，需补译检查）"
            if [ -s /tmp/changed-docs.txt ]; then
              sed 's/^/- \`/' /tmp/changed-docs.txt | sed 's/$/\`/'
            else
              echo "（无文档内容变更，仅组件源码/依赖变化）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune upstream workflows and push merged zh
        if: steps.merge.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .github/workflows/sync-deploy.yml /tmp/sync-deploy.yml
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/sync-deploy.yml .github/workflows/sync-deploy.yml
          # 增量补译队列：把本次被上游改动的"已翻译文件"追加到 TRANSLATION_TODO.md
          if [ -s /tmp/changed-docs.txt ]; then
            {
              echo "- $(date -u +%Y-%m-%d) @ upstream $(head -c 8 /tmp/upstream-sha.txt):"
              sed 's/^/    - /' /tmp/changed-docs.txt
            } >> TRANSLATION_TODO.md
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(zh): sync upstream $(head -c 8 /tmp/upstream-sha.txt)"
          fi
          git push origin zh