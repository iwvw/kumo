name: Translate docs via opencode agent

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: translate-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DSUKHUB_API_KEY: ${{ secrets.DSUKHUB_API_KEY }}
  ISSUE_NUMBER: ${{ github.event.issue.number }}

jobs:
  translate:
    if: contains(github.event.issue.labels.*.name, 'translation')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zh
        uses: actions/checkout@v6
        with:
          ref: zh
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "opencode[bot]"
          git config --global user.email "opencode[bot]@users.noreply.github.com"

      - name: Dedup guard (skip if issue already closed)
        id: guard
        run: |
          STATE=$(gh api repos/${{ github.repository }}/issues/${ISSUE_NUMBER} --jq .state)
          echo "issue state: ${STATE}"
          if [ "${STATE}" = "open" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install opencode
        if: steps.guard.outputs.proceed == 'true'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run opencode agent (incremental translation)
        if: steps.guard.outputs.proceed == 'true'
        env:
          MODEL: ${{ vars.OPENCODE_MODEL }}
          MODEL_BACKUP: ${{ vars.OPENCODE_MODEL_BACKUP }}
        run: |
          cat > /tmp/prompt.md <<'EOF'
            You are the maintenance agent of the Simplified-Chinese localization of the Cloudflare Kumo docs (fork iwvw/kumo, branch `zh`).

            Context: translate the documentation files listed in issue #__ISSUE_NUMBER__. Read the issue first with:
              gh issue view __ISSUE_NUMBER__
            to get the exact file list. Work on the current branch `zh`. If necessary, ensure upstream is merged first:
              git fetch upstream main && git merge upstream/main --no-edit
            (resolve any conflicts by translating; the re-translated content wins over English.)

            STRICT RULES (violating any is a failure):
            1. ONLY modify the files listed in the issue (paths under packages/kumo-docs-astro/src). Never touch other files, never add or delete files. If a listed file is already fully translated, state it in your summary and skip it.
            2. Translate ONLY user-visible English prose into natural Simplified Chinese: headings, paragraphs, list items, table cells, and the frontmatter `description` value. Do NOT translate: code blocks (keep byte-identical), component/API identifiers (Button, Badge...), frontmatter keys (layout/title/sourceFile), imports, JSX/Astro props and their code-like values, links, anchors, URLs, file paths, brand nouns (Kumo, Base UI, Tailwind, CLI, Figma, npm, pnpm, ARIA).
            3. Preserve exact Markdown/JSX structure, indentation and whitespace; do not reformat/reflow/reorder.
            4. Consistent terms: Installation→安装, Usage→用法, Examples→示例, API Reference→API 参考, Variants→变体, Sizes→尺寸, States→状态, Accessibility→无障碍, Barrel→桶式导出, Granular→细粒度导入, Blocks→区块, Charts→图表.
            5. After editing, verify the build: `pnpm install`, then `pnpm --filter @cloudflare/kumo build`, then `pnpm --filter @cloudflare/kumo-docs-astro build`. Fix problems until it passes. NEVER push a broken build.
            6. Commit your changes on `zh` (subject: `docs(zh): translate issue #__ISSUE_NUMBER__`), then `git push origin zh`. Only commit/push if there are real changes; skip if nothing changed.
            7. Close the loop: post a concise summary comment on the issue with `gh issue comment __ISSUE_NUMBER__` — which files were translated (or "no changes needed, all already translated"), that the build passed, and whether a commit was pushed. Then close it with `gh issue close __ISSUE_NUMBER__`.
            You are done ONLY after step 7.
          EOF
          sed -i "s/__ISSUE_NUMBER__/${ISSUE_NUMBER}/g" /tmp/prompt.md
          PROMPT="$(cat /tmp/prompt.md)"
          OPENCODE=/home/runner/.opencode/bin/opencode
          echo "primary model: ${MODEL}"
          if ! "${OPENCODE}" run -m "${MODEL}" "$PROMPT"; then
            echo "primary model failed; falling back to ${MODEL_BACKUP}"
            "${OPENCODE}" run -m "${MODEL_BACKUP}" "$PROMPT" || exit 1
          fi